<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz-tavle</title>
<meta name="description" content="Tilpasselig quiz-tavle i Jeopardy-stil med kategorier, point, hold, nedtælling og lyd.">
<style>
:root{
  --page-bg:#000; --page-text:#fff; --board-gap:#000;
  --tile-bg:#060ce9; --tile-bg2:#0410a8; --value:#ffcc00; --value-dark:#b38600;
  --cat-bg:#060ce9; --cat-text:#fff;
  --q-bg:#060ce9; --q-text:#fff; --a-text:#ffcc00;
  --heading-font:'Anton', Impact, 'Arial Black', sans-serif;
  --body-font:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius:6px; --bg-image:none; --case:uppercase;
  --ui-bg:#ffffff; --ui-text:#1b1d24; --ui-muted:#626775; --ui-line:#dfe2ea; --ui-accent:#2448d8; --ui-soft:#f3f5fa;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--page-bg) var(--bg-image) center/cover no-repeat fixed;
  color:var(--page-text); font-family:var(--body-font);
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}

/* ---------- Top ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{max-height:48px;max-width:120px;object-fit:contain}
.brand h1{margin:0;font-family:var(--heading-font);font-weight:400;letter-spacing:.03em;text-transform:var(--case);font-size:clamp(1.2rem,2.6vw,2.2rem);line-height:1.05}
.brand p{margin:2px 0 0;opacity:.8;font-size:.9rem}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;font-size:.9rem;backdrop-filter:blur(4px)}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.primary{background:var(--value);color:#111;border-color:transparent;font-weight:600}
/* Knapperne øverst til højre: uden ramme og baggrund */
.actions .tbtn{background:none;border:none;backdrop-filter:none;color:inherit;opacity:.85}
.actions{gap:2px;align-items:center}
.actions .tbtn{display:flex;align-items:center;justify-content:center;padding:6px}
.actions .tbtn svg{display:block;width:15px;height:15px;stroke-width:1.75}
.actions .tbtn:hover{background:none;opacity:1;transform:scale(1.12)}
.actions .tbtn.primary{color:var(--value);font-weight:600}

/* ---------- Board ---------- */
main{flex:1 1 auto;min-height:0;padding:0 16px 10px}
.board{height:100%;display:grid;gap:clamp(3px,.5vw,8px);background:var(--board-gap);padding:clamp(3px,.5vw,8px);border-radius:calc(var(--radius) + 4px)}
.cell{border:none;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;min-height:0;min-width:0;overflow:hidden}
.cat{background:var(--cat-bg);color:var(--cat-text);font-family:var(--heading-font);text-transform:var(--case);font-size:clamp(.7rem,1.6vw,1.5rem);line-height:1.1;letter-spacing:.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);word-break:break-word}
.tile{position:relative;background:linear-gradient(160deg,var(--tile-bg),var(--tile-bg2));color:var(--value);font-family:var(--heading-font);font-size:clamp(1rem,3.4vw,3.2rem);transition:transform .12s}
/* Hover: feltet lyser op og vokser lidt — skriften beholder sin farve */
.tile::before{content:'';position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;transition:opacity .12s;pointer-events:none}
.tile:hover:not(.used){transform:scale(1.03)}
.tile:hover:not(.used)::before{opacity:.14}
.tile .v{position:relative}
.tile.used{cursor:default;color:transparent;filter:saturate(.6) brightness(.75)}
.tile.empty{cursor:default;opacity:.35}
.board.filling .tile{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- Scores ---------- */
.scoreboard{flex:0 0 auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 16px 14px}
.team{min-width:130px;background:transparent;border:2px solid var(--tcol,#fff);border-radius:10px;padding:6px 12px;text-align:center}
.team .tn{font-size:.85rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.team .ts{font-family:var(--heading-font);font-size:clamp(1.2rem,2.2vw,2rem);color:var(--value);background:none;border:none;padding:0;line-height:1.1}
.team .ts.neg{color:#ff6b6b}
.team .adj{display:flex;gap:4px;justify-content:center;margin-top:2px}
.team .adj button{background:rgba(255,255,255,.12);border:none;color:inherit;border-radius:5px;padding:0 8px;font-size:.8rem}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px;background:var(--page-bg) var(--bg-image) center/cover no-repeat}
.splash h2{font-family:var(--heading-font);font-weight:400;text-transform:var(--case);font-size:clamp(2.2rem,8vw,6rem);margin:0;color:var(--value);line-height:1}
.splash p{margin:0;font-size:clamp(1rem,2vw,1.4rem);opacity:.85}
.note{border:none;background:none;color:var(--value);font-size:1.6rem;line-height:1;padding:4px 8px}
.note:hover{opacity:.75}
.note.on{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.splash img{max-height:22vh;max-width:60vw}
.bigbtn{background:var(--value);color:#111;border:none;border-radius:999px;padding:14px 34px;font-size:1.2rem;font-weight:700;transition:transform .12s,filter .12s}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn:active{transform:scale(.97)}

/* ---------- Question ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;padding:clamp(8px,2vw,24px);background:rgba(0,0,0,.6)}
.qcard{flex:1;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--q-bg),var(--tile-bg2));color:var(--q-text);border-radius:calc(var(--radius) + 6px);padding:clamp(14px,2.5vw,32px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:zoom .38s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:var(--ox,50%) var(--oy,50%);min-height:0;overflow:auto}
@keyframes zoom{from{transform:scale(.08);opacity:.4}to{transform:none;opacity:1}}
.qmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.qinfo{display:flex;flex-direction:column;gap:2px;font-family:var(--heading-font);text-transform:var(--case);font-size:clamp(.9rem,1.6vw,1.4rem);opacity:.9}
.qinfo .v{color:var(--value)}
.qclose{border:none;background:none;color:inherit;opacity:.6;padding:4px;margin:-4px -4px 0 0;display:flex}
.qclose:hover{opacity:1}
.qclose svg{width:26px;height:26px}
.qclose .lbl{display:none}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,24px);text-align:center;padding:12px 0;min-height:0}
.qtext{font-family:var(--heading-font);text-transform:var(--case);font-size:clamp(1.35rem,3.9vw,3.7rem);line-height:1.12;white-space:pre-line;max-width:1400px;overflow-wrap:anywhere}
.qtext.sm{font-size:clamp(1.2rem,2.9vw,2.7rem)}
.mcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vw,16px);width:min(1100px,100%)}
.mcopt{display:flex;align-items:center;gap:14px;text-align:left;padding:clamp(10px,1.6vh,18px) 18px;border-radius:calc(var(--radius) + 6px);color:inherit;
  font-size:clamp(1rem,2.1vw,1.8rem);font-weight:600;line-height:1.2;transition:background .2s,opacity .3s,transform .12s;
  border:2px solid rgba(128,128,128,.4);border:2px solid color-mix(in srgb, var(--q-text) 28%, transparent);
  background:rgba(128,128,128,.14);background:color-mix(in srgb, var(--q-text) 9%, transparent)}
.mcopt:hover{transform:translateY(-2px)}
.mcopt b{flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--value);color:#111;font-family:var(--heading-font);font-weight:400}
.mcopt span{overflow-wrap:anywhere}
.mcopt.sel{border-color:var(--value);background:color-mix(in srgb, var(--value) 22%, transparent)}
.mcopt.right{background:#20b26b;border-color:#20b26b;color:#fff;animation:pop .35s both}
.mcopt.right b{background:#fff}
.mcopt.wrongsel{background:#e04848;border-color:#e04848;color:#fff}
.mcopt.dim{opacity:.38}
.qplayer{display:flex;align-items:center;gap:12px;width:min(680px,100%)}
.qplay{flex:0 0 auto;width:clamp(52px,7vh,72px);height:clamp(52px,7vh,72px);border-radius:50%;border:none;background:var(--value);color:#111;display:flex;align-items:center;justify-content:center;padding:0}
.qplay svg{width:42%;height:42%}
.qplay.on{animation:beat 1.1s ease-in-out infinite}
.qrestart{border:none;background:none;color:inherit;opacity:.75;padding:6px;display:flex}
.qrestart:hover{opacity:1}
.qprog{flex:1;height:8px;border-radius:99px;overflow:hidden;cursor:pointer;background:rgba(128,128,128,.3);background:color-mix(in srgb, var(--q-text) 20%, transparent)}
.qprog i{display:block;height:100%;width:0;background:var(--value)}
.qtime{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right;font-size:.95rem;opacity:.85}
.qmissing{font-size:.95rem;opacity:.75}
@media (max-width:640px){.mcgrid{grid-template-columns:1fr}}
.qimg{max-width:min(90%,800px);max-height:36vh;border-radius:var(--radius);object-fit:contain}
.atext{font-family:var(--heading-font);text-transform:var(--case);color:var(--a-text);font-size:clamp(1.05rem,2.5vw,2.3rem);line-height:1.12;white-space:pre-line;animation:pop .3s both;overflow-wrap:anywhere}
.atext small{display:block;font-size:.45em;opacity:.8;color:var(--q-text);margin-bottom:.3em}
.dd{font-family:var(--heading-font);text-transform:var(--case);font-size:clamp(2.4rem,9vw,8rem);color:var(--value);animation:spin .9s cubic-bezier(.2,.9,.3,1.1) both;line-height:1}
@keyframes spin{from{transform:rotate(-540deg) scale(.1)}to{transform:none}}
.ddpick{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:min(760px,100%);animation:fadeup .5s .5s both}
.ddstep{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.ddteams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ddteam{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;color:inherit;font-weight:600;font-size:clamp(.95rem,1.6vw,1.15rem);
  border:2px solid rgba(128,128,128,.35);border:2px solid color-mix(in srgb, var(--q-text) 22%, transparent);background:none;transition:background .15s,border-color .15s}
.ddteam::before{content:'';width:.65em;height:.65em;border-radius:50%;background:var(--tcol);box-shadow:0 0 0 .75px rgba(128,128,128,.55)}
.ddteam:hover{border-color:color-mix(in srgb, var(--q-text) 45%, transparent)}
.ddteam.on{border-color:var(--value);background:color-mix(in srgb, var(--value) 20%, transparent)}
.ddteam small{opacity:.65;font-weight:400}
.ddamount{display:flex;align-items:center;gap:clamp(10px,2vw,22px)}
.ddamount .step{width:46px;height:46px;border-radius:50%;border:none;background:none;color:inherit;opacity:.7;display:flex;align-items:center;justify-content:center;padding:0}
.ddamount .step:hover{opacity:1}
.ddamount input{width:6ch;text-align:center;font-family:var(--heading-font);font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;color:var(--value);background:none;border:none;border-bottom:2px solid color-mix(in srgb, var(--q-text) 25%, transparent);padding:0 0 4px;-moz-appearance:textfield;appearance:textfield}
.ddamount input::-webkit-inner-spin-button,.ddamount input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ddamount input:focus{outline:none;border-bottom-color:var(--value)}
.ddquick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ddquick button{border:none;background:none;color:inherit;opacity:.7;font-size:.9rem;padding:5px 12px;border-radius:999px}
.ddquick button:hover{opacity:1;background:color-mix(in srgb, var(--q-text) 10%, transparent)}
.ddquick button.on{opacity:1;color:var(--value)}
.timer{display:flex;align-items:flex-start;gap:14px;margin:6px 0 10px}
.timer .tbar{margin-top:9px}
.tside{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:4.5em}
.ticon{border:none;background:none;color:var(--q-text);opacity:.6;padding:4px;display:flex;align-items:center;gap:6px}
.ticon svg{width:20px;height:20px;stroke-width:1.5}
.ticon:hover{opacity:1}
.tbar{flex:1;height:12px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--value);transform-origin:left;border-radius:99px}
.tnum{font-family:var(--heading-font);font-size:1.15rem;line-height:1.2;white-space:nowrap;color:var(--q-text)}
.qcontrols{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qcontrols .tbtn{font-size:1rem;padding:9px 16px}
.award{display:flex;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:center;margin-top:14px}
.award .who{display:flex;align-items:center;gap:2px}
.award .who span{font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:3px;margin-right:6px}
/* Holdfarve som prik med tynd kant — så både sorte og hvide hold kan ses */
.award .who span::before{content:'';display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.45em;vertical-align:.05em;
  background:var(--tcol,#fff);box-shadow:0 0 0 .75px rgba(128,128,128,.55)}
.award button{border:none;background:none;color:inherit;width:32px;height:32px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s,background .15s}
.award button:hover{opacity:1}
.award button.ok.on{background:#20b26b;color:#fff;opacity:1}
.award button.no.on{background:#e04848;color:#fff;opacity:1}
/* Ikonknapperne ved siden af 'Vis svar': helt enkle, uden ramme */
.qcontrols{align-items:center;gap:14px}
.qcontrols .tbtn.icon{background:none;border:none;backdrop-filter:none;color:inherit;opacity:.7;padding:6px;display:flex;align-items:center;gap:6px}
.qcontrols .tbtn.icon:hover{opacity:1}
.qcard.compact .lbl,.qcard.compact .hint{display:none}
.hint{font-size:.8rem;opacity:.65;text-align:center;margin-top:10px}

/* ---------- Editor (light UI, independent of theme) ---------- */
.editor{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.45)}
.panel{width:min(980px,100%);height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ui-line);gap:10px}
.phead h2{margin:0;font-size:1.2rem}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--ui-line);overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 12px 9px;color:var(--ui-muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ui-accent);border-color:var(--ui-accent)}
.pbody{flex:1;overflow:auto;padding:18px 20px 40px}
.pbody h3{font-size:1rem;margin:22px 0 8px}
.pbody h3:first-child{margin-top:0}
.pbody p.note{color:var(--ui-muted);font-size:.88rem;margin:4px 0 12px;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--ui-muted);flex:1 1 180px;min-width:0}
.fld.sm{flex:0 0 110px}
.fld input[type=text],.fld input[type=number],.fld input[type=url],.fld textarea,.fld select{font:inherit;font-size:.92rem;color:var(--ui-text);background:#fff;border:1px solid var(--ui-line);border-radius:7px;padding:7px 9px;width:100%}
.fld textarea{resize:vertical;min-height:58px}
.fld input[type=color]{width:100%;height:36px;border:1px solid var(--ui-line);border-radius:7px;padding:2px;background:#fff}
.chk{display:flex;align-items:center;gap:7px;font-size:.9rem;color:var(--ui-text)}
.btn{background:var(--ui-soft);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:8px;padding:7px 12px;font-size:.88rem}
.btn:hover{border-color:#b9bfcd}
.btn.acc{background:var(--ui-accent);color:#fff;border-color:var(--ui-accent)}
.btn.danger{color:#b42323}
.btn.sm{padding:3px 8px;font-size:.8rem}
details.catcard{border:1px solid var(--ui-line);border-radius:10px;margin-bottom:10px;background:#fff}
details.catcard>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:600}
details.catcard>summary::-webkit-details-marker{display:none}
details.catcard>summary::before{content:'▸';color:var(--ui-muted);transition:transform .15s}
details.catcard[open]>summary::before{transform:rotate(90deg)}
details.catcard>summary .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catinner{padding:4px 12px 12px;border-top:1px solid var(--ui-line)}
.qrow{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--ui-line)}
.qrow:last-child{border-bottom:none}
.qrow .extra{grid-column:2 / 4;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qrow .extra .fld{flex:1 1 220px}
.mced{display:flex;flex-direction:column;gap:6px}
.mced .o{display:flex;align-items:center;gap:6px}
.mced .o b{width:1.4em;text-align:center;color:var(--ui-text)}
.mced .o input[type=text]{flex:1;font:inherit;font-size:.9rem;color:var(--ui-text);border:1px solid var(--ui-line);border-radius:7px;padding:6px 8px;min-width:0}
.qaud{grid-column:2 / 4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ui-muted)}
.qaud .nm{color:var(--ui-text);font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qaud input[type=number]{width:70px;font:inherit;border:1px solid var(--ui-line);border-radius:7px;padding:4px 6px}
@media (max-width:640px){.qaud{grid-column:auto}}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.preset{border:1px solid var(--ui-line);border-radius:10px;padding:0;overflow:hidden;background:#fff;text-align:left}
.preset .sw{height:46px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px}
.preset .sw i{border-radius:3px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.75rem}
.preset b{display:block;padding:6px 8px;font-size:.82rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sndrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ui-line)}
.sndrow .nm{font-weight:600}
.sndrow .st{font-size:.8rem;color:var(--ui-muted)}
.sndrow .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.teamrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.teamrow input[type=text]{flex:1;font:inherit;border:1px solid var(--ui-line);border-radius:7px;padding:7px 9px;min-width:0}
.teamrow input[type=color]{width:42px;height:36px;border:1px solid var(--ui-line);border-radius:7px;padding:2px}
.callout{background:#fff8e1;border:1px solid #f1d98a;border-radius:9px;padding:10px 12px;font-size:.88rem;line-height:1.45;color:#5b4a12;margin-bottom:14px}
.win{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;isolation:isolate;
  background:radial-gradient(ellipse at 50% 18%, rgba(255,255,255,.10), transparent 55%), var(--page-bg) var(--bg-image) center/cover no-repeat}
.win .rays{position:fixed;left:50%;top:26%;width:170vmax;height:170vmax;z-index:-2;pointer-events:none;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.06) 0deg 7deg, transparent 7deg 18deg);
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--value) 16%, transparent) 0deg 7deg, transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle, #000 0, transparent 42%);mask-image:radial-gradient(circle, #000 0, transparent 42%);
  animation:rays 50s linear infinite, fadein 1.2s both}
@keyframes rays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win .spot{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 45% at 50% 30%, transparent 40%, rgba(0,0,0,.35))}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wincard{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:960px;width:100%}
.trophywrap{position:relative;width:clamp(70px,min(15vw,15vh),150px);aspect-ratio:1;animation:rise .9s cubic-bezier(.2,.9,.3,1.25) both}
.trophywrap .glow{position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.22), transparent 62%);

.trophy{position:relative;width:100%;height:100%;display:block;overflow:visible}
.trophy .shine{animation:shine 3.2s ease-in-out 1s infinite}
@keyframes shine{0%{transform:skewX(-20deg) translateX(-10px)}45%,100%{transform:skewX(-20deg) translateX(60px)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.06);opacity:1}}

.wlabel{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:clamp(.85rem,1.8vw,1.15rem);letter-spacing:.32em;text-transform:uppercase;opacity:.9;animation:fadeup .6s .45s both}
.wlabel::before,.wlabel::after{content:'';width:clamp(28px,6vw,70px);height:2px;background:var(--value);border-radius:2px}
.wname{margin-top:4px;font-family:var(--heading-font);text-transform:var(--case);font-size:clamp(2.4rem,min(9vw,11vh),7rem);line-height:1;color:var(--page-text);overflow-wrap:anywhere;animation:slam .7s .65s cubic-bezier(.2,1.4,.4,1) both}

@keyframes fadeup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.wscore{display:inline-flex;align-items:baseline;gap:4px;margin-top:6px;padding:6px 20px;border-radius:999px;border:2px solid var(--value);font-family:var(--heading-font);font-size:clamp(1.3rem,3vw,2.3rem);color:var(--value);animation:fadeup .6s 1s both;font-variant-numeric:tabular-nums}
.wscore small{font-size:.55em;opacity:.85}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.2vw,14px);margin-top:clamp(8px,2vh,24px);width:min(620px,100%)}
.pcol{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}
.pcol .pn{font-weight:700;font-size:clamp(.85rem,1.6vw,1.1rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeup .5s both;animation-delay:var(--dl2)}
.pcol .ps{font-family:var(--heading-font);color:var(--value);font-size:clamp(.95rem,1.8vw,1.3rem);animation:fadeup .5s both;animation-delay:var(--dl2)}
.pblock{height:var(--h);border-radius:10px 10px 0 0;background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), var(--medal);
  display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--heading-font);font-size:clamp(1.5rem,min(3.6vw,5vh),2.8rem);color:rgba(0,0,0,.5);
  transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--dl)}
.pcol .pn::before{content:'';display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em;vertical-align:.02em;background:var(--tcol);box-shadow:0 0 0 1.5px rgba(128,128,128,.7)}
.pcol .pn{padding-left:3px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ranking{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.9rem;opacity:.85;animation:fadeup .5s 2s both}
.ranking li{display:flex;gap:6px;align-items:center}
.ranking li::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--tcol)}
.ranking .sc{font-family:var(--heading-font);color:var(--value)}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;animation:fadeup .5s 2.2s both}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1d24;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}

@media (max-width:640px){

  .topbar{flex-wrap:wrap}
  .tbtn{padding:6px 9px;font-size:.82rem}
  main{padding:0 6px 8px}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================

const APP_VERSION = '22';
const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- Temaer ---------- */
const PRESETS = {

/* Skrifttyper: lokale + Google Fonts (hentes kun hvis valgt og der er internet) */
const FONTS = {
  'system':'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',

/* ---------- Eksempel-indhold ---------- */
function q(value, question, answer, extra={}) { return { id:uid(), value, q:question, a:answer, img:'', dd:false, ...extra }; }
function exampleConfig() {

function blankConfig(cols=5, rows=5) {
  const c = exampleConfig();
  c.title = 'Min quiz'; c.subtitle = '';
  c.categories = Array.from({length:cols}, (_,i) => ({ id:uid(), name:`Kategori ${i+1}`,
    questions: Array.from({length:rows}, (_,r) => q((r+1)*100, '', '')) }));
  return c;
}
/* Farve ud fra holdnavnet: "Hold Rød" → rød, "De Blå" → blå osv. */
const NAME_COLORS = [
  [/lyserød|pink/, '#ff5fa2'], [/rød|røde|rode|red/, '#e0303a'], [/blå|blaa|blue/, '#2f6fe0'], [/grøn|grøn+e|green/, '#2fae4e'],
  [/gul|gule|yellow/, '#f5c518'], [/sort|sorte|black/, '#111111'], [/hvid|hvide|white/, '#ffffff'], [/orange/, '#ff8a1f'],
  [/lilla|purple/, '#8e44ad'], [/brun|brune|brown/, '#8b5a2b'], [/grå|graa|grey|gray/, '#8a8f98'], [/turkis|turkise|turquoise/, '#1ec8c8'],
  [/guld|gold/, '#d4af37'], [/sølv|silver/, '#c0c0c0'],
];
function colorFromName(name) {
  const n = ' ' + String(name || '').toLowerCase() + ' ';
  for (const [re, col] of NAME_COLORS)
    if (new RegExp('[^a-zæøå](' + re.source + ')(?![a-zæøå])').test(n)) return col;

   ===================================================================== */
const b64std = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const unb64std = str => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
const b64url = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
async function packQuiz(cfg) {
  let bytes = new TextEncoder().encode(JSON.stringify(cfg)), tag = 'j';
  if (window.CompressionStream) {
    try { const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(st).arrayBuffer()); tag = 'z'; } catch (e) {}
  }
  return tag + b64url(bytes);
}
async function unpackQuiz(str) {
  let bytes = unb64url(str.slice(1));
  if (str[0] === 'z') {
    if (!window.DecompressionStream) throw new Error('Din browser er for gammel til at åbne linket. Opdatér browseren.');
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(st).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function makeShareLink() {
  const cfg = JSON.parse(JSON.stringify(state.config)), warnings = [];
  const isData = v => typeof v === 'string' && v.startsWith('data:');
  if (isData(cfg.theme.bgImage)) { cfg.theme.bgImage = ''; warnings.push('Det uploadede baggrundsbillede kommer ikke med.'); }
  if (isData(cfg.logo)) { cfg.logo = ''; warnings.push('Det uploadede logo kommer ikke med.'); }
  let imgs = 0; cfg.categories.forEach(c => c.questions.forEach(x => { if (isData(x.img)) { x.img = ''; imgs++; } }));
  if (imgs) warnings.push(`${imgs} uploadede billede(r) i spørgsmål kommer ikke med.`);
  if (Object.keys(Sound.custom).length) warnings.push('Egne lydfiler kommer ikke med — modtageren hører de indbyggede lyde.');
  const nAud = cfg.categories.reduce((n, c) => n + c.questions.filter(x => x.audio).length, 0);
  if (nAud) warnings.push(`${nAud} spørgsmål har lyd — sangene kommer ikke med i linket. Send i stedet quizzen som fil (Eksportér med lyd).`);
  const base = location.href.split('#')[0];
  return { link: base + '#q=' + await packQuiz(cfg), warnings };
}
/* Åbnet via et delt link? Så indlæses quizzen og linket ryddes op */
async function loadSharedFromHash() {
  const m = /^#q=(.+)$/.exec(location.hash); if (!m) return;
  try {
    const cfg = await unpackQuiz(m[1]);

    el('div', {class:'row'}, field('Afrundede hjørner', rad), el('div', {class:'fld'}, check(th, 'uppercase', 'STORE BOGSTAVER på tavlen'))),
    el('p', {class:'note'}, 'Skrifttyper som Anton, Lobster m.fl. hentes fra Google Fonts og kræver internet. Uden net bruges en lignende standardskrift.'));

  p.append(el('h3', {}, 'Billeder & pointvisning'),
    el('div', {class:'row'}, field('Baggrundsbillede (link)', txt(th, 'bgImage', {type:'url', ph:'https://…'})), field('Logo (link)', txt(c, 'logo', {type:'url', ph:'https://…'}))),
    el('div', {class:'row'}, field('Før point (fx "$")', txt(c.rules, 'valuePrefix', {ph:''}), 'sm'), field('Efter point (fx " kr.")', txt(c.rules, 'valueSuffix', {ph:''}), 'sm')));
  const up = (label, setter) => el('label', {class:'btn'}, label, el('input', {type:'file', accept:'image/*', hidden:true, onchange: e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1.5e6) { toast('Billedet er stort — brug gerne et link eller et mindre billede (under 1,5 MB).'); }
    const r = new FileReader(); r.onload = () => { setter(r.result); changed(true); }; r.readAsDataURL(f);
  }}));
  p.append(el('div', {class:'row'}, up('Upload baggrundsbillede', v => th.bgImage = v), up('Upload logo', v => c.logo = v),
    el('button', {class:'btn', onclick: () => { th.bgImage = ''; c.logo = ''; changed(true); }}, 'Fjern billeder')));
}

/* --- Hold & regler --- */
function edTeams(p) {
  const c = state.config;
  p.append(el('h3', {}, 'Hold / deltagere'), el('p', {class:'note'}, 'Klik på farveboksen for at vælge holdets farve. Står der en farve i holdnavnet (fx “Hold Rød” eller “De Blå”), skifter farven automatisk.'));
  c.teams.forEach((t, i) => p.append(el('div', {class:'teamrow'},
    el('input', {type:'color', value:t.color, title:'Holdets farve', oninput: e => { t.color = e.target.value; changed(); }}),
    el('input', {type:'text', value:t.name, oninput: e => { t.name = e.target.value;
      if (autoTeamColor(t)) { const cp = e.target.previousElementSibling; if (cp) cp.value = t.color; } changed(); }}),
    el('span', {style:'min-width:70px;text-align:right;color:var(--ui-muted)'}, fmt(score(t.id))),
    el('button', {class:'btn sm danger', onclick: () => { if (c.teams.length > 1 && confirm(`Fjern ${t.name}?`)) { c.teams.splice(i,1); changed(true); } }}, '✕'))));
  const palette = ['#ff5a5f','#3ec1d3','#9be15d','#ffb400','#c77dff','#ff8fab','#4dabf7','#f4a261'];
  p.append(el('button', {class:'btn', onclick: () => { c.teams.push({ id:uid(), name:`Hold ${c.teams.length+1}`, color: palette[c.teams.length % palette.length] }); changed(true); }}, '+ Tilføj hold'));

  p.append(el('h3', {}, 'Regler'),
    el('div', {class:'row'}, field('Nedtælling (sekunder)', txt(c.rules, 'timer', {type:'number'}), 'sm'),
      field('Overskrift over svaret', txt(c.rules, 'answerLabel')), field('Tekst ved Dobbelt op-felt', txt(c.rules, 'ddLabel')), field('Tekst over vinderen', txt(c.rules, 'winnerLabel'))),
    el('div', {class:'fld', style:'margin:6px 0 12px'}, 'Ved forkert svar',
      ...[[true, 'Holdet mister point (spørgsmålets værdi trækkes fra)'], [false, 'Holdet får bare ingen point (0)']].map(([v, label]) =>
        el('label', {class:'chk'}, el('input', {type:'radio', name:'wrongRule', checked: !!c.rules.deductWrong === v,
          onchange: () => { c.rules.deductWrong = v; changed(); }}), label)),
      el('span', {style:'font-size:.8rem'}, 'Gælder også Dobbelt op-felter. Kan skiftes midt i spillet — pointene regnes om med det samme.')),
    el('div', {class:'row', style:'flex-direction:column;align-items:flex-start'},
      check(c.rules, 'autoTimer', 'Start nedtællingen automatisk, når et spørgsmål åbnes'),
      check(c.rules, 'autoPlayAudio', 'Afspil spørgsmålets lyd automatisk, når spørgsmålet åbnes'),
      check(c.rules, 'showHelp', 'Vis knaptekster og genvejshjælp under spørgsmålene'),
      check(c.rules, 'autoWinner', 'Vis vinderskærmen automatisk, når alle spørgsmål er brugt')));
}

/* --- Lyd --- */
function edSound(p) {
  const s = state.config.sound;
  p.append(el('div', {class:'callout'},
    'Alle lyde og tænkemusikken er syntetiseret direkte i browseren og er original musik — så skabelonen kan deles frit. ',
    'Har du selv en lydfil, du må bruge (fx en købt/licenseret version af den kendte tænkemelodi), kan du uploade den nedenfor; den gemmes kun i din egen browser.'));
  p.append(el('h3', {}, 'Generelt'),
    el('div', {class:'row', style:'flex-direction:column;align-items:flex-start'},
      check(s, 'enabled', 'Lyd slået til', () => renderHeader()), check(s, 'music', 'Spil tænkemusik under nedtællingen'), check(s, 'titleMusic', 'Spil titelmelodi på startskærmen')),
    el('div', {class:'row'}, field('Lydstyrke', el('input', {type:'range', min:0, max:1, step:.05, value:s.volume, oninput: e => { Sound.setVolume(Number(e.target.value)); save(); }}))),
    el('div', {class:'row'}, el('button', {class:'btn acc', onclick: () => {
      Sound.unlock(); const was = s.enabled; s.enabled = true; Sound.play('correct'); s.enabled = was;
      setTimeout(() => toast(Sound.ctx && Sound.ctx.state === 'running'
        ? 'Hørte du et "ding"? Ellers: skru op, og tjek Lydløs-knappen på iPhone/iPad.'
        : 'Browseren blokerer lyden på denne side.'), 400);
    }}, '🔈 Test lyd')),
    el('h3', {}, 'Lyd-diagnose'),
    el('p', {class:'note'}, `Version ${APP_VERSION} · Web Audio: ${Sound.ctx ? Sound.ctx.state : 'ikke startet'} · Forberedte lyde: ${Object.keys(Sound.rendered).length} · Egne filer: ${Object.keys(Sound.custom).length} · Lyd ${s.enabled ? 'slået til' : 'SLÅET FRA'} · Lydstyrke ${Math.round(s.volume*100)} %`),
    el('pre', {id:'sndlog', style:'background:var(--ui-soft);border:1px solid var(--ui-line);border-radius:8px;padding:10px;font-size:.78rem;white-space:pre-wrap;min-height:60px;margin:0'}, Sound.log.join('\n') || 'Ingen lyde afspillet endnu.'),
  );
  p.append(el('h3', {}, 'Lydeffekter'));
  let preview = null;
  for (const [slot, info] of Object.entries(SOUND_SLOTS)) {
    const cu = Sound.custom[slot];
    p.append(el('div', {class:'sndrow'},
      el('div', {}, el('div', {class:'nm'}, info.name), el('div', {class:'st'}, info.desc + ' · ' + (cu ? `Egen fil: ${cu.name}` : 'Indbygget lyd'))),
      el('div', {class:'bt'},
        el('button', {class:'btn sm', onclick: () => {
          if (preview) { preview.stop(); preview = null; }
          const was = s.enabled, wasM = s.music; s.enabled = true; s.music = true;
          preview = Sound.play(slot, { duration: 8 }); s.enabled = was; s.music = wasM;
          if (slot === 'think' && preview) { const h = preview; setTimeout(() => h.stop(), 8000); }
        }}, '▶ Afspil'),
        el('button', {class:'btn sm', onclick: () => { if (preview) { preview.stop(); preview = null; } }}, '■'),
        el('label', {class:'btn sm'}, 'Upload egen…', el('input', {type:'file', accept:'audio/*', hidden:true, onchange: async e => {
          const f = e.target.files[0]; if (!f) return;
          let data;
          try { data = await f.arrayBuffer(); } catch (err) { toast('Kunne ikke læse filen'); return; }
          const type = f.type || 'audio/mpeg';
          try { await AudioDB.put(slot, { data, type, name:f.name }); } catch (err) { toast('Filen virker nu, men kunne ikke gemmes til næste gang (' + (err && err.name) + ')'); }
          if (Sound.custom[slot]) URL.revokeObjectURL(Sound.custom[slot].url);
          Sound.custom[slot] = { url: URL.createObjectURL(new Blob([data], { type })), name: f.name };
          Sound.note(`Uploadet "${f.name}" (${type}, ${Math.round(f.size/1024)} KB) til ${SOUND_SLOTS[slot].name}`);
          renderEditor(); toast('Lyd gemt');
        }})),
        cu && el('button', {class:'btn sm danger', onclick: async () => {
          try { await AudioDB.del(slot); } catch (e) {}
          URL.revokeObjectURL(cu.url); delete Sound.custom[slot]; renderEditor();
        }}, 'Brug indbygget'))));
  }
}

/* --- Gem & del --- */
function edFile(p) {
  p.append(el('p', {class:'note'}, 'Alt gemmes automatisk i denne browser. Eksportér quizzen som fil for at tage backup, dele den eller have flere quizzer klar (fx én til julefrokosten og én til fødselsdagen).'));
  p.append(el('h3', {}, 'Del quizzen med et link'),
    el('p', {class:'note'}, 'Linket indeholder hele quizzen: spørgsmål, udseende, hold og regler. Den, der åbner linket, får præcis din quiz. Ændrer du quizzen bagefter, skal du lave et nyt link.'));
  const out = el('input', {type:'text', readOnly:true, placeholder:'Klik på "Lav delingslink"', onclick: e => e.target.select()});
  const info = el('p', {class:'note'});
  p.append(el('div', {class:'row'},
    el('button', {class:'btn acc', onclick: async () => {
      try {
        const { link, warnings } = await makeShareLink();
        out.value = link; out.select();
        info.textContent = `Linket er ${link.length.toLocaleString('da-DK')} tegn langt.` + (warnings.length ? ' Bemærk: ' + warnings.join(' ') : '');
        try { await navigator.clipboard.writeText(link); toast('Link kopieret — sæt det ind i en besked eller mail'); } catch (e) { toast('Linket er klar — kopiér det fra feltet'); }
      } catch (e) { toast('Kunne ikke lave linket: ' + e.message); }
    }}, '🔗 Lav delingslink'),
    el('button', {class:'btn', onclick: async () => { if (!out.value) return; try { await navigator.clipboard.writeText(out.value); toast('Kopieret'); } catch (e) { out.select(); document.execCommand && document.execCommand('copy'); toast('Kopieret'); } }}, 'Kopiér')),
    field('', out), info,
    el('p', {class:'note'}, 'Egne lydfiler og billeder, du har uploadet fra din computer, kommer ikke med i linket (de er for store). Billeder indsat som link (https://…) kommer med.'));
  p.append(el('h3', {}, 'Eksportér & importér'), el('div', {class:'row'},
    el('button', {class:'btn acc', onclick: async () => {
      const audio = {};
      try {
        const all = await AudioDB.all();
        const qids = new Set(state.config.categories.flatMap(c => c.questions.map(x => x.id)));
        for (const [k, v] of Object.entries(all)) {
          if (!v) continue;
          if (k.startsWith('q:') ? !qids.has(k.slice(2)) : !SOUND_SLOTS[k]) continue;
          const buf = v.data || (v.blob && await v.blob.arrayBuffer()); if (!buf) continue;
          audio[k] = { name: v.name, type: v.type || 'audio/mpeg', b64: b64std(new Uint8Array(buf)) };
        }
      } catch (e) {}
      const data = JSON.stringify({ format:'quiztavle', version:2, config: state.config, audio });
      const a = el('a', { href: URL.createObjectURL(new Blob([data], {type:'application/json'})),
        download: (state.config.title || 'quiz').replace(/[^\wæøåÆØÅ\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase() + '.json' });
      document.body.append(a); a.click(); a.remove();
    }}, '⬇ Eksportér quiz med lyd (.json)'),
    el('label', {class:'btn'}, '⬆ Importér quiz…', el('input', {type:'file', accept:'.json,application/json', hidden:true, onchange: e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => {
        try {
          const d = JSON.parse(r.result); const cfg = d.config || d;
          if (!cfg.categories) throw new Error('mangler kategorier');
          state = normalize({ config: cfg, progress: emptyProgress() });
          (async () => {
            let n = 0;
            for (const [k, v] of Object.entries(d.audio || {})) {
              try {
                const bytes = unb64std(v.b64), type = v.type || 'audio/mpeg';
                await AudioDB.put(k, { data: bytes.buffer, type, name: v.name }).catch(() => {});
                const url = URL.createObjectURL(new Blob([bytes], { type }));
                if (k.startsWith('q:')) QAudio[k.slice(2)] = { url, name: v.name }; else Sound.custom[k] = { url, name: v.name };
                n++;
              } catch (e) {}
            }
            changed(true); toast('Quiz importeret' + (n ? ` med ${n} lydfil${n > 1 ? 'er' : ''}` : ''));
          })();
        } catch (err) { toast('Filen kunne ikke læses som en quiz'); }
      }; r.readAsText(f);
    }}))),
    el('p', {class:'note'}, 'Filen indeholder hele quizzen inkl. spørgsmålenes sange og dine egne lydeffekter, så den kan sendes til en anden og importeres der. Med mange sange kan filen blive stor (et par MB pr. sang).'));
  p.append(el('h3', {}, 'Start forfra'), el('div', {class:'row'},
    el('button', {class:'btn', onclick: () => { if (confirm('Nulstil point og gør alle felter klar igen?')) { state.progress = emptyProgress(); changed(true); toast('Spillet er nulstillet'); } }}, 'Nulstil point & tavle'),
    el('button', {class:'btn', onclick: () => { const cols = Number(prompt('Antal kategorier?', 5)); const rows = Number(prompt('Antal spørgsmål pr. kategori?', 5));
      if (!cols || !rows) return; if (!confirm('Erstat alle spørgsmål med en tom skabelon?')) return;
      const keep = { theme: state.config.theme, teams: state.config.teams, sound: state.config.sound, rules: state.config.rules };
      state = { config: { ...blankConfig(Math.min(cols,12), Math.min(rows,10)), ...keep }, progress: emptyProgress() }; tab = 'content'; changed(true); }}, 'Tom skabelon (behold udseende)'),
    el('button', {class:'btn danger', onclick: () => { if (confirm('Gendan eksempel-quizzen? Dine spørgsmål og indstillinger overskrives.')) { state = { config: exampleConfig(), progress: emptyProgress() }; changed(true); } }}, 'Gendan eksempel')));
}

/* =====================================================================
   OPSTART & GENVEJE
   ===================================================================== */
function updateTitleBtn() { const on = Sound.isPlaying('title'), b = $('#btnTitle');
  b.classList.toggle('on', on); b.title = on ? 'Stop titelmelodi' : 'Spil titelmelodi'; b.setAttribute('aria-label', b.title); }
function playTitle(quiet=false) {
  if (!state.config.sound.titleMusic || $('#splash').hidden) return;
  Sound.play('title', { quiet, duration: Sound.durations.title - .3 });
  setTimeout(updateTitleBtn, 300);
}
function showSplash() { stopTimer(false); Sound.stopAll(); $('#splash').hidden = false; playTitle(); updateTitleBtn(); }
$('#btnStart').onclick = () => { Sound.unlock(); Sound.stopAll(); $('#splash').hidden = true; renderBoard(true); Sound.play('intro'); };
$('#btnTitle').onclick = () => {
  Sound.unlock();
  if (Sound.isPlaying('title')) { Sound.stopAll(); updateTitleBtn(); return; }
  const was = state.config.sound.titleMusic; state.config.sound.titleMusic = true; playTitle(); state.config.sound.titleMusic = was;
};
// Klik et vilkårligt sted på startskærmen starter titelmelodien (Safari kræver et klik før lyd)
$('#splash').addEventListener('pointerup', e => { if (e.target.closest('button')) return; if (!Sound.isPlaying('title')) playTitle(); });
$('#btnHome').onclick = () => { Sound.unlock(); showSplash(); };
$('#btnEdit').onclick = openEditor;
$('#btnEditDone').onclick = closeEditor;
$('#editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; renderEditor(); } });
$('#btnSound').onclick = () => { state.config.sound.enabled = !state.config.sound.enabled; save(); renderHeader(); };
$('#btnFull').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
$('#btnNew').onclick = () => { if (!confirm('Start et nyt spil? Point nulstilles, og alle felter bliver klar igen.')) return;
  state.progress = emptyProgress(); save(); renderAll(true); Sound.play('intro'); };
$('#btnWinner').onclick = () => { Sound.unlock(); showWinner(); };
$('#btnWinBack').onclick = hideWinner;
$('#btnWinNew').onclick = () => { hideWinner(); state.progress = emptyProgress(); save(); renderAll(true); Sound.play('intro'); };
$('#btnTimer').onclick = startTimer;
$('#btnReveal').onclick = reveal;
$('#btnClose').onclick = closeQuestion;
document.addEventListener('keydown', e => {
  if (!$('#editor').hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (!$('#winOverlay').hidden) { if (e.key === 'Escape') hideWinner(); return; }
  if ($('#qOverlay').hidden) return;
  if (e.key === 'Escape') closeQuestion();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reveal(); }
  else if (e.key.toLowerCase() === 't') startTimer();
  else if (/^[1-4]$/.test(e.key)) { const b = document.querySelector(`#mcGrid .mcopt[data-i="${Number(e.key) - 1}"]`); if (b) b.click(); }
});

['pointerdown','touchend','keydown'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), { capture:true, passive:true }));
renderAll();
loadSharedFromHash();
window.addEventListener('hashchange', loadSharedFromHash);
// Forbered lydfilerne (kræver ikke klik) og prøv at starte titelmelodien — Safari venter ofte på første klik
Sound.loadCustom().then(() => Sound.prerender()).then(() => { if (!Sound.unlocked) playTitle(true); });
</script>
